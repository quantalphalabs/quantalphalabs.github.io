# Runs the snap sim on the NFL calendar. Every 15 minutes it asks autorun.py
# what is due (the night-before run at 8pm ET, the pregame check 2 hours before
# each kickoff, grading once finals are in) and commits whatever changed under
# sim/. Most runs find nothing due and finish in under a minute.
name: Snap sim

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run a stage now instead of waiting for its time"
        type: choice
        options: [none, night, pregame]
        default: none
      games:
        description: "Comma-separated game_ids for a forced run (blank: the current week's open games)"
        required: false

concurrency:
  group: snap-sim
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/rotobot-sim/requirements.txt

      - run: pip install -r research/rotobot-sim/requirements.txt

      - name: Run whatever is due
        env:
          FORCE: ${{ inputs.force }}
          GAMES: ${{ inputs.games }}
        run: |
          extra=""
          if [ -n "$FORCE" ] && [ "$FORCE" != "none" ]; then
            extra="--force $FORCE"
            [ -n "$GAMES" ] && extra="$extra --games $GAMES"
          fi
          cd research/rotobot-sim
          python autorun.py --data "$RUNNER_TEMP/nflverse" --site ../../sim $extra

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain sim)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "snap-sim[bot]"
          git config user.email "snap-sim@users.noreply.github.com"
          git add sim
          git commit -q -m "Snap sim: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
          # Branch-built Pages sites may not rebuild on a token push; ask explicitly.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null || true
